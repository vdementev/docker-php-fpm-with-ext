name: Build & Push Images

on:
  push:
    branches: [main]
    # paths:
    #   - "Dockerfile.*"
    #   - ".github/workflows/**"
    #   - "conf/**"
    #   - "shim/**"
    #   - "README.md"
  workflow_dispatch:

env:
  IMAGE_REPO: ${{ secrets.DOCKERHUB_USERNAME }}/php-fpm-with-ext

concurrency:
  group: build-image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    permissions:
      contents: read
      packages: write
      id-token: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - dockerfile: Dockerfile.7.0-fpm
            version: "7.0"
            flavor: "fpm"
          - dockerfile: Dockerfile.7.1-fpm
            version: "7.1"
            flavor: "fpm"
          - dockerfile: Dockerfile.7.2-fpm
            version: "7.2"
            flavor: "fpm"
          - dockerfile: Dockerfile.7.3-fpm
            version: "7.3"
            flavor: "fpm"
          - dockerfile: Dockerfile.7.4-cli.builder
            version: "7.4"
            flavor: "cli-builder"
          - dockerfile: Dockerfile.7.4-fpm
            version: "7.4"
            flavor: "fpm"
          - dockerfile: Dockerfile.8.0-fpm
            version: "8.0"
            flavor: "fpm"
          - dockerfile: Dockerfile.8.1-fpm
            version: "8.1"
            flavor: "fpm"
          - dockerfile: Dockerfile.8.2-fpm
            version: "8.2"
            flavor: "fpm"
          - dockerfile: Dockerfile.8.3-cli.builder
            version: "8.3"
            flavor: "cli-builder"
          - dockerfile: Dockerfile.8.3-cli
            version: "8.3"
            flavor: "cli"
          - dockerfile: Dockerfile.8.3-fpm
            version: "8.3"
            flavor: "fpm"
          - dockerfile: Dockerfile.8.4-cli.builder
            version: "8.4"
            flavor: "cli-builder"
          - dockerfile: Dockerfile.8.4-cli
            version: "8.4"
            flavor: "cli"
          - dockerfile: Dockerfile.8.4-fpm
            version: "8.4"
            flavor: "fpm"
          - dockerfile: Dockerfile.8.5-cli.builder
            version: "8.5"
            flavor: "cli-builder"
          - dockerfile: Dockerfile.8.5-cli
            version: "8.5"
            flavor: "cli"
          - dockerfile: Dockerfile.8.5-fpm
            version: "8.5"
            flavor: "fpm"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_REPO }}
          tags: |
            type=raw,value=${{ matrix.version }}-${{ matrix.flavor }}
          labels: |
            org.opencontainers.image.title=php-fpm-with-ext (${{ matrix.version }}-${{ matrix.flavor }})
            org.opencontainers.image.description=PHP ${{ matrix.version }} ${{ matrix.flavor }} image with common extensions preinstalled and the PrestaShop chmod(0) LD_PRELOAD shim.
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=MIT

      - name: Build & push ${{ matrix.version }}-${{ matrix.flavor }}
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          sbom: true
          provenance: mode=max
          cache-from: type=gha,scope=${{ matrix.version }}-${{ matrix.flavor }}
          cache-to: type=gha,mode=max,scope=${{ matrix.version }}-${{ matrix.flavor }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Install Cosign
        uses: sigstore/cosign-installer@v4.1.1

      - name: Sign image with Cosign (keyless)
        env:
          COSIGN_EXPERIMENTAL: "true"
          DIGEST: ${{ steps.build.outputs.digest }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          set -euo pipefail
          for tag in $TAGS; do
            cosign sign --yes "${tag}@${DIGEST}"
          done

  sync-description:
    needs: build-and-push
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Sync Docker Hub description
        uses: peter-evans/dockerhub-description@v5
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ secrets.DOCKERHUB_USERNAME }}/php-fpm-with-ext
          short-description: "PHP-FPM / CLI images with common extensions and PrestaShop chmod(0) shim. PHP 7.0–8.5."
          readme-filepath: ./DOCKERHUB.md
