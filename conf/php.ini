[PHP]
expose_php = Off
allow_url_fopen = On
allow_url_include = Off
display_errors = Off
ignore_repeated_errors = On
error_reporting = E_ALL & ~E_DEPRECATED & ~E_STRICT
max_input_time = -1
max_execution_time = 3600
max_input_vars = 50000
memory_limit = 1024M
post_max_size = 1024M
upload_max_filesize = 1024M

realpath_cache_size = 4096K
realpath_cache_ttl = 600

; Block the process-spawning family as a whole, plus source disclosure and
; runtime extension loading. Aliases are listed next to their primary name
; (show_source/highlight_file) — blocking only one leaves the other callable.
; Deliberately NOT blocked: getmypid/getmyuid (posix_getpid makes it moot and
; google/gax calls it on every request), diskfreespace (its alias
; disk_free_space made the entry cosmetic), link.
disable_functions = dl, exec, highlight_file, passthru, pcntl_exec, popen, proc_close, proc_get_status, proc_nice, proc_open, proc_terminate, shell_exec, show_source, system

[opcache]
; Values follow PrestaShop's "Optimize your PrestaShop" guide, with
; max_accelerated_files doubled from its 16229 — a PS install with a full
; module set and a WordPress alongside it runs well past 16k files.
; enable_file_override stays off: it caches file_exists() results, which is the
; wrong answer to have cached while PS is rewriting its compiled container.
; JIT is off — PHP 8.4 ships it off by default and it does nothing measurable
; for an I/O-bound Symfony/PrestaShop request.
opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 512
opcache.interned_strings_buffer = 32
opcache.max_accelerated_files = 32531
opcache.max_wasted_percentage = 10
opcache.revalidate_freq = 10
opcache.enable_file_override = 0
opcache.max_file_size = 0
opcache.validate_timestamps = 1
opcache.revalidate_path = 0
opcache.jit = disable
opcache.jit_buffer_size = 0

[Session]
session.use_strict_mode = 1
session.use_only_cookies = 1
session.auto_start = 0
session.gc_probability = 1
session.gc_divisor = 500
session.cookie_httponly = 1
session.cookie_samesite = "Lax"
